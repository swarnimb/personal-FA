# Build and deploy the demo artifact to GitHub Pages.
# Triggered on push to main and manual dispatch. Static export only — no
# runtime server. See docs/plan.md Task 68 for the spec and docs/prd.md § 14
# for the deployment AC.
#
# Setup note (one-time, manual): Before the first deploy lands, the repo
# Settings → Pages source must be set to "GitHub Actions" (not the legacy
# gh-pages branch source). The deploy-pages action will fail otherwise.

name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN scopes — minimum required for Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Single in-flight deploy at a time. cancel-in-progress: false so a queued
# push doesn't cancel an in-flight deploy mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Transient Postgres for build-time queries only. Holds the seeded
    # fictional dataset; torn down at job end. Database name 'amibroke_demo'
    # is distinct from 'amibroke' (V1.0) and 'amibroke_test' (integration
    # suite) — keeps env namespaces clean.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amibroke_demo
        ports:
          - 5432:5432
        # Native health-check so GitHub Actions waits for Postgres before
        # starting steps. Defensive pg_isready loop below is belt-and-braces.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Job-level env so every step inherits. DATABASE_URL points at the
    # service-container Postgres (ephemeral, no real secret). ENCRYPTION_KEY
    # is intentionally NOT set — Task 59 demo gate makes it unnecessary.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amibroke_demo
      NEXT_PUBLIC_DEMO_MODE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Defensive wait — service health check above should already gate this,
      # but Prisma migrations have flaked on cold-start Postgres in CI before.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Postgres failed to become ready after 60s" >&2
          exit 1

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo data
        run: npx tsx prisma/seed-demo.ts

      # Physically remove src/app/api/ from the tree before building.
      # Next.js `output: 'export'` inspects route-handler exports at build
      # time and aborts on (a) dynamic [id] segments without
      # generateStaticParams() and (b) handlers without
      # `dynamic = 'force-static'`. The runtime isDemoMode() guard inside
      # each handler runs too late — Next.js never reaches handler code
      # during build. Stash now; CI container is torn down after the job
      # so no restore is needed. Local `npm run dev --demo` is unaffected
      # because that command runs the JIT dev server, which does not
      # enforce the static-export contract.
      - name: Stash API routes (incompatible with static export)
        run: |
          if [ -d src/app/api ]; then
            mv src/app/api /tmp/api-stash
            echo "Stashed $(find /tmp/api-stash -name 'route.ts' | wc -l) route handler files"
          else
            echo "No src/app/api directory to stash"
          fi

      # NEXT_PUBLIC_DEMO_MODE=true triggers the next.config.mjs shim to load
      # next.config.demo.mjs (output:'export', basePath:'/personal-FA',
      # trailingSlash:true). Produces ./out/ instead of ./.next/.
      # DATABASE_URL inherited from job env — build-time page renders query
      # the seeded Postgres to bake all 6 range datasets per CONSTRAINT-13.
      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
